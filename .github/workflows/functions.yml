name: Functions CI/CD

on:
  push:
    branches: [ main, fix/time-rift-controller ]
    paths: [ 'functions/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'functions/**' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (functions)
        working-directory: functions
        run: npm ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Audit Dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate --json > audit.json

          # 1) If no vulnerabilities => clean
          if jq -e '(.vulnerabilities // {}) | length == 0' audit.json > /dev/null 2>&1; then
            echo "No vulnerabilities - clean"
            exit 0
          fi

          # 2) Allow ONLY fast-xml-parser, and ONLY if GHSA-37qj-frw5-hhjh is present in its "via"
          if jq -e '
            (.vulnerabilities // {}) as $v
            | (($v | keys | sort) == ["fast-xml-parser"])
            and (
              ($v["fast-xml-parser"].via // [])
              | any(
                  (type=="string" and .=="GHSA-37qj-frw5-hhjh")
                  or (type=="object" and (.source?=="GHSA-37qj-frw5-hhjh" or .url? | tostring | contains("GHSA-37qj-frw5-hhjh")))
                )
            )
            and (
              # Ensure fast-xml-parser does not carry other via items beyond the allowed one
              ($v["fast-xml-parser"].via // [])
              | all(
                  (type=="string" and .=="GHSA-37qj-frw5-hhjh")
                  or (type=="object" and (.source?=="GHSA-37qj-frw5-hhjh" or .url? | tostring | contains("GHSA-37qj-frw5-hhjh")))
                )
            )
          ' audit.json > /dev/null 2>&1; then
            echo "Only known fast-xml-parser advisory present - proceeding"
            exit 0
          fi

          echo "New or additional vulnerabilities detected - failing build"
          cat audit.json
          exit 1
        working-directory: functions

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Test Functions
        working-directory: functions
        run: npm test

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/fix/time-rift-controller' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (functions)
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@latest

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Deploy to Staging
        run: |
          cd functions
          firebase deploy --only functions --project staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (functions)
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@latest

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Deploy to Prod
        run: |
          cd functions
          firebase deploy --only functions --project prod
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PROD }}